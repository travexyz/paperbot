<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            text-align: center;
        }

        #editor {
            position: relative;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
    </style>
    <title>PaperBot - Welcome</title>
</head>

<body>
    <form action="/eval" method="post">
        <div id="editor"></div>
        <input name="command" id="command" style="display: none;">
        <br>
        <div class="container">
            <input id="eval-btn" type="submit" value="Eval">
        </div>
    </form>

    <br> <br>

    <form action="/broadcast" method="post">
        <div class="container">
            <label for="message">
                Message: <input type="text" name="message">
            </label>
            <input type="submit" name="broadcast" value="Broadcast to Admins" />
        </div>
    </form>

    <br>

    <form action="/setcredit" method="post">
        <div class="container">
            <label for="id">
                User ID: <input type="number" name="id">
            </label>
            <label for="credit">
                Credit: <input type="number" name="credit">
            </label>
            <input type="submit" name="setcredit" value="Set Credit" />
        </div>
    </form>

    <br>

    <form action="/devmode" method="post">
        <div class="container">
            <input type="submit" name="devmode" value="Toggle DevMode" />
        </div>
    </form>

    <br>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.5/ace.js" type="text/javascript" charset="utf-8">
    </script>
    <script>
        var editor = ace.edit("editor", {
            theme: "ace/theme/chrome",
            mode: "ace/mode/javascript",
            maxLines: 30,
            wrap: true,
            autoScrollEditorIntoView: true
        })

        const inputArea = document.getElementById("command")
        editor.getSession().on("change", function () {
            inputArea.value = editor.getSession().getValue()
        })
    </script>
</body>

</html>
